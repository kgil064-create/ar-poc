<!DOCTYPE html>
<html lang="ko">
<!--
  xr-test.html — three.js 공식 예제 webxr_ar_camera_access 복제

  원본: https://github.com/mrdoob/three.js/blob/r186/examples/webxr_ar_camera_access.html
  three.js 버전: r186 (npm three@0.186.0)

  목적 (역방향 증분 1단계):
    WebXR immersive-ar 세션 + 카메라 텍스처 접근이 갤럭시 S24 울트라에서
    되는지 증명한다. 우리 자산(glb/png/mind)은 하나도 투입하지 않는다.
    여기서 실패하면 옵션 B(WebXR) 전체가 불가이므로 C(8th Wall) 재검토.

  ───────────────────────────────────────────────────────────────────────
  원본에서 바꾼 것 (전부 아래 3가지뿐. 3D 로직은 한 글자도 안 건드림)

   1) [경로] importmap 을 상대경로 → CDN 절대경로로 교체 (전부 HTTP 200 실측)
        "../build/three.module.js"  →  https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js
        "./jsm/"                    →  https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/
      ※ three.module.js 는 같은 폴더의 three.core.js 를 import 하므로 CDN 경로라야 함께 해결된다.

   2) [경로] <link href="main.css"> 제거 → #info 스타일만 인라인으로 대체.
      main.css 는 three.js 사이트 전용 스타일이고 우리 환경엔 없다.

   3) [추가] 화면 내 진단 로그.
      폰에는 콘솔이 없다 (HANDOFF.md §8 — 프로젝트 상시 전제).
      이게 없으면 폰에서 실패했을 때 "안 됩니다" 외에 아무 정보도 못 얻는다.
      3D 로직과 섞이지 않게 아래 [진단] 블록으로 분리해 뒀다.

  ⚠️ ARButton.createButton 호출은 공식 그대로 두었다.
     ARButton 은 자기 자신의 dom-overlay(X 버튼만 들어있음)를 만들어 쓰는데,
     Android Chrome 의 immersive-ar 세션 중에는 그 overlay 안의 내용만 보인다.
     즉 아래 로그창은 세션 중에는 안 보이고, 세션 시작 전/종료 후에만 보인다.
     domOverlay 를 우리 것으로 덮어쓰면 세션 중에도 보이게 할 수 있지만,
     그러면 "공식 예제가 되는가"를 검증하는 자리에 검증 안 된 변수를 더하게 된다.
     → 세션 중 성공 신호는 **큐브에 카메라 영상이 입혀지는 것** 자체로 판단하고,
       자세한 내용은 X 버튼으로 세션을 끝낸 뒤 로그에서 읽는다.
  ───────────────────────────────────────────────────────────────────────
-->
	<head>
		<title>three.js ar - camera access (xr-test 1단계)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

		<style>
			/* main.css 대체 — 원본의 #info 배치만 재현 */
			* { box-sizing: border-box; }
			body {
				margin: 0; overflow: hidden; background: #000; color: #fff;
				font-family: -apple-system, "Malgun Gothic", monospace, sans-serif;
			}
			#info {
				position: absolute; top: 0; width: 100%; padding: 10px;
				box-sizing: border-box; text-align: center;
				-moz-user-select: none; -webkit-user-select: none; user-select: none;
				pointer-events: none; z-index: 1; font-size: 13px; line-height: 1.5;
			}
			#info a { color: #7fdcff; pointer-events: auto; }

			/* [추가] 진단 로그창 — 폰에 콘솔이 없으므로 필수 */
			#logbox {
				position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 40;
				max-height: 50vh; overflow-y: auto;
				background: rgba(0,0,0,.92); color: #b6ffb6; border: 1px solid #0a0;
				border-radius: 10px; padding: 10px; font-family: monospace; font-size: 11px;
				line-height: 1.5; white-space: pre-wrap; word-break: break-all;
			}
			#logbox .e { color: #ff8080; font-weight: bold; }
			#logbox .w { color: #ffd280; }
			#logbox .ok { color: #7fff7f; font-weight: bold; }
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ar - camera access<br/>
			<small>1단계 검증: immersive-ar + camera-access</small>
		</div>

		<!-- [추가] 진단 로그창 -->
		<div id="logbox"></div>

		<!-- =========================================================
		     [진단] 화면 내 로그. 3D 로직보다 먼저 올려서 모듈 로드 실패까지 잡는다.
		     (import 에러는 window error 로 올라온다)
		     ========================================================= -->
		<script>
		(function () {
			'use strict';
			var logbox = document.getElementById('logbox');
			var n = 0;
			window.xrlog = function (msg, kind) {
				n++;
				var d = document.createElement('div');
				if (kind) d.className = kind;
				d.textContent = '[' + n + '] ' + msg;
				logbox.appendChild(d);
				logbox.scrollTop = logbox.scrollHeight;
			};
			window.addEventListener('error', function (ev) {
				xrlog('JS 에러: ' + ev.message + ' @ ' + (ev.filename || '?') + ':' + (ev.lineno || '?'), 'e');
			});
			window.addEventListener('unhandledrejection', function (ev) {
				var r = ev.reason;
				xrlog('처리안된 실패: ' + (r && r.message ? r.message : r), 'e');
			});

			xrlog('페이지 시작. ' + location.protocol + '//' + location.host);
			if (location.protocol === 'file:') {
				xrlog('file:// 로는 작동하지 않습니다. Live Server 로 여세요.', 'e');
			}

			// ---------- WebXR 사전 점검 (세션 시작 전이므로 화면에 보인다) ----------
			if (!navigator.xr) {
				xrlog('navigator.xr 없음 → 이 브라우저는 WebXR 미지원. '
				    + 'PC 에서는 정상입니다. 폰(Android Chrome)에서 테스트하세요.', 'w');
			} else {
				xrlog('navigator.xr 있음');
				navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
					if (ok) xrlog('immersive-ar 지원됨 → START AR 버튼을 누르세요', 'ok');
					else    xrlog('immersive-ar 미지원 (PC 라면 정상. Android 라면 ARCore 설치/업데이트 확인)', 'w');
				}).catch(function (e) {
					xrlog('isSessionSupported 실패: ' + e.message, 'e');
				});
			}
		})();
		</script>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { ARButton } from 'three/addons/webxr/ARButton.js';

			// [추가] 라이브러리 로드 확인
			xrlog('three.js 로드됨. REVISION = ' + THREE.REVISION, 'ok');

			const timer = new THREE.Timer();
			timer.connect( document );

			let camera, scene, renderer;
			let cube;

			init();

			async function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

				const defaultLight = new THREE.HemisphereLight( 0xffffff, 0xbbbbff, 3 );
				defaultLight.position.set( 0.5, 1, 0.25 );
				scene.add( defaultLight );

				//

				renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.xr.enabled = true;
				container.appendChild( renderer.domElement );

				//

				document.body.appendChild( ARButton.createButton( renderer, { requiredFeatures: [ 'camera-access' ] } ) );

				//

				const boxGeometry = new THREE.BoxGeometry( 1, 1, 1 );
				const boxMaterial = new THREE.MeshStandardMaterial();
				cube = new THREE.Mesh( boxGeometry, boxMaterial );
				cube.position.z = - 3;

				scene.add( cube );

				//

				window.addEventListener( 'resize', onWindowResize );

				// ---------- [추가] 진단 ----------
				const r = renderer.domElement.getBoundingClientRect();
				xrlog( '캔버스 크기: ' + Math.round( r.width ) + ' x ' + Math.round( r.height )
				     + ( r.height < 1 ? '  ← 높이 0! (ar.html 과 같은 함정)' : '  (정상)' ),
				     r.height < 1 ? 'e' : '' );
				xrlog( 'START AR 버튼 생성됨. 버튼 글자가 "AR NOT SUPPORTED" 면 폰에서 테스트하세요.' );

				renderer.xr.addEventListener( 'sessionstart', () => {
					const s = renderer.xr.getSession();
					xrlog( 'AR 세션 시작됨. enabledFeatures = '
					     + ( s.enabledFeatures ? JSON.stringify( s.enabledFeatures ) : '(미보고)' ), 'ok' );
				} );
				renderer.xr.addEventListener( 'sessionend', () => {
					xrlog( 'AR 세션 종료됨. 위 로그를 확인하세요.' );
				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			// [추가] 세션당 1회만 로그를 남기기 위한 플래그 (매 프레임 로그는 폰을 멈춘다)
			let loggedCameraOk = false;
			let loggedNoCameraView = false;

			function setCameraTexture() {

				if ( ! renderer.xr.getSession() ) {

					if ( cube.material.map ) {

						cube.material.map = null;
						cube.material.needsUpdate = true;

					}

					loggedCameraOk = false;
					loggedNoCameraView = false;

					return;

				}

				const frame = renderer.xr.getFrame();
				const referenceSpace = renderer.xr.getReferenceSpace();

				if ( ! frame || ! referenceSpace ) return;

				const viewerPose = frame.getViewerPose( referenceSpace );

				if ( ! viewerPose ) return;

				const view = viewerPose.views.find( view => view.camera );

				// [추가·의도적 수정] 원본은 여기서 바로 view.camera 를 읽는다.
				// camera-access 가 실제로 안 붙은 기기에서는 view 가 undefined 가 되어
				// 매 프레임 TypeError 가 난다. 폰에서는 콘솔이 없어 원인 불명이 되므로
				// 가드를 넣고 1회만 로그를 남긴다.
				if ( ! view ) {

					if ( ! loggedNoCameraView ) {

						loggedNoCameraView = true;
						xrlog( 'view.camera 없음 → camera-access 가 실제로 부여되지 않았습니다. '
						     + '세션은 떴지만 카메라 텍스처는 못 받는 상태.', 'e' );

					}

					return;

				}

				const cameraTexture = renderer.xr.getCameraTexture( view.camera );

				if ( ! loggedCameraOk ) {

					loggedCameraOk = true;
					xrlog( '카메라 텍스처 획득 성공 ('
					     + view.camera.width + ' x ' + view.camera.height + ') — 1단계 통과', 'ok' );

				}

				if ( cube.material.map === cameraTexture ) return;

				cube.material.map = cameraTexture;
				cube.material.needsUpdate = true;

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				setCameraTexture();

				cube.rotation.x += delta;
				cube.rotation.y += delta;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
